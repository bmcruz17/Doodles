<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PackHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#329bf0"/>
      <stop offset="1" stop-color="#0d4f92"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.28" y1="0.05" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffdd97"/>
      <stop offset="0.5" stop-color="#f4ab43"/>
      <stop offset="1" stop-color="#cf7c1a"/>
    </linearGradient>
    <linearGradient id="ear" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#cd8324"/>
      <stop offset="1" stop-color="#84490d"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff2d6"/>
      <stop offset="1" stop-color="#f4c675"/>
    </radialGradient>
    <radialGradient id="noseG" cx="0.4" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#5a4327"/>
      <stop offset="0.5" stop-color="#33220f"/>
      <stop offset="1" stop-color="#1c1207"/>
    </radialGradient>
    <radialGradient id="eyeG" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5b3f22"/>
      <stop offset="1" stop-color="#1e1305"/>
    </radialGradient>
    <linearGradient id="tongue" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f77f96"/>
      <stop offset="1" stop-color="#de4b6c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>

  <!-- soft ground shadow for lift -->
  <ellipse cx="32" cy="51" rx="15" ry="3.6" fill="#062c52" opacity="0.4"/>

  <!-- ears -->
  <path d="M22.5 22.5C13.5 20.2 8 30.6 11.4 43.4c1.6 5.9 8.9 5.3 11.3-1.1-2.1-6.7-2.2-13.5-.2-19.8Z" fill="url(#ear)"/>
  <path d="M41.5 22.5c9-2.3 14.5 8.1 11.1 20.9-1.6 5.9-8.9 5.3-11.3-1.1 2.1-6.7 2.2-13.5.2-19.8Z" fill="url(#ear)"/>
  <path d="M22.5 22.5c-1.3 5.9-1.2 12.1.3 18.3" fill="none" stroke="#ffca7a" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M41.5 22.5c1.3 5.9 1.2 12.1-.3 18.3" fill="none" stroke="#ffca7a" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>

  <!-- head -->
  <path d="M32 12.5c10.8 0 15.3 7.6 15.3 16.9 0 11.7-6.6 20.6-15.3 20.6s-15.3-8.9-15.3-20.6C16.7 20.1 21.2 12.5 32 12.5Z" fill="url(#fur)"/>
  <!-- inner bottom shading for form -->
  <path d="M17 32c2.5 9.7 8.2 16.5 15 16.5S44.5 41.7 47 32c-.6 10.9-6.8 18-15 18s-14.4-7.1-15-18Z" fill="#a5610f" opacity="0.35"/>
  <!-- top rim light -->
  <path d="M32 12.5c8 0 12.4 4.2 14.3 10.6-3-5.2-8.1-8.3-14.3-8.3s-11.3 3.1-14.3 8.3C19.6 16.7 24 12.5 32 12.5Z" fill="#ffffff" opacity="0.32"/>

  <!-- muzzle -->
  <ellipse cx="32" cy="41" rx="9.7" ry="8.4" fill="url(#muzzle)"/>

  <!-- eyes -->
  <ellipse cx="25.4" cy="29.6" rx="2.9" ry="3.1" fill="url(#eyeG)"/>
  <ellipse cx="38.6" cy="29.6" rx="2.9" ry="3.1" fill="url(#eyeG)"/>
  <circle cx="26.5" cy="28.3" r="1" fill="#fff"/>
  <circle cx="39.7" cy="28.3" r="1" fill="#fff"/>
  <circle cx="24.7" cy="30.8" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="37.9" cy="30.8" r="0.5" fill="#fff" opacity="0.5"/>

  <!-- nose -->
  <path d="M26.7 36.3c1.7-3.2 8.9-3.2 10.6 0 1.2 2.4-2 4.7-5.3 5.2-3.3-.5-6.5-2.8-5.3-5.2Z" fill="url(#noseG)"/>
  <ellipse cx="29.8" cy="36.8" rx="2" ry="1.1" fill="#fff" opacity="0.55"/>

  <!-- goofy tongue -->
  <path d="M29.9 44.6h4.2v3.8a2.1 2.1 0 0 1-4.2 0Z" fill="url(#tongue)"/>
  <path d="M32 44.6v6" stroke="#c53f60" stroke-width="0.7" opacity="0.55"/>
</svg>
