<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PackHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17273d"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffdd93"/>
      <stop offset="0.5" stop-color="#f2b04a"/>
      <stop offset="1" stop-color="#d98f28"/>
    </linearGradient>
    <symbol id="dog" viewBox="0 0 44 60">
      <path fill="#f2b04a" stroke="#0d1826" stroke-width="1.8" stroke-linejoin="round"
        d="M22 5 C28 5 31 8 31 13 L34 13 C38 15 38 23 32 25
          C36 31 37 36 34 41 C38 49 38 55 32 56 L29 56 C28 58 26 58 25 56
          L24 56 L24 45 L20 45 L20 56 L19 56 C18 58 16 58 15 56 L12 56
          C6 55 6 49 10 41 C7 36 8 31 12 25 C6 23 6 15 10 13 L13 13
          C13 8 16 5 22 5 Z"/>
      <g fill="#f2b04a">
        <circle cx="16" cy="8" r="4"/>
        <circle cx="22" cy="5.5" r="4.3"/>
        <circle cx="28" cy="8" r="4"/>
      </g>
    </symbol>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- crest -->
  <path d="M25 25 Q25 19 31 18 L69 18 Q75 19 75 25 C75 53 68 81 50 94 C32 81 25 53 25 25 Z"
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- the pack: Saint Berdoodle (center, bigger) flanked by two doodles -->
  <use href="#dog" x="40" y="34" width="20" height="27"/>
  <use href="#dog" x="27" y="42" width="15" height="20"/>
  <use href="#dog" x="58" y="42" width="15" height="20"/>
</svg>
